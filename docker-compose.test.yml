services:
  postgres-test:
    image: postgres:16-alpine
    container_name: safebrowse-postgres-test
    environment:
      POSTGRES_USER: safebrowse
      POSTGRES_PASSWORD: safebrowse_password
      POSTGRES_DB: safebrowse_test
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U safebrowse -d safebrowse_test']
      interval: 2s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data
