name: Windows MSI Pilot Packaging

on:
  workflow_dispatch:
    inputs:
      pilotBackendUrl:
        description: Pilot Backend URL
        required: false
        type: string
        default: https://safebrowse.porwal.online

  push:
    branches:
      - feature/stage11-step4-device-enforcement

jobs:
  build-windows-msi:
    name: Build Windows MSI Pilot Package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared and protocol workspaces
        run: |
          npm run build:shared
          npm run build:protocol

      - name: Build Windows agent
        run: npm run build:windows

      - name: Verify PowerShell Account Discovery Script Syntax (AST Parser Gate)
        shell: pwsh
        run: |
          $scriptLines = & node -e "const { WindowsAccountManager } = require('./packages/agent-windows/dist/account-manager.js'); console.log(WindowsAccountManager.getDiscoveryPowerShellScript());"
          if (-not $scriptLines) {
            Write-Error "Failed to retrieve discovery script from WindowsAccountManager"
            exit 1
          }
          $scriptText = [string]::Join([Environment]::NewLine, $scriptLines)
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput($scriptText, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            Write-Error "PowerShell AST syntax validation FAILED with $($errors.Count) error(s):"
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host "PowerShell AST parser gate PASSED: 0 syntax errors in account discovery script."

      - name: Run Windows agent automated tests
        timeout-minutes: 10
        run: npm run test --workspace=@safebrowse/agent-windows

      - name: Compile Windows Service Host Wrapper (SafeBrowseServiceHost.exe)
        shell: pwsh
        run: |
          $cscPath = "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          if (-not (Test-Path $cscPath)) {
            $cscCmd = Get-Command csc.exe -ErrorAction SilentlyContinue
            if ($cscCmd) {
              $cscPath = $cscCmd.Source
            } else {
              $cscPath = "csc.exe"
            }
          }

          $relSource = "packages/agent-windows/service-host/SafeBrowseServiceHost.cs"
          if (-not (Test-Path $relSource)) {
            Write-Error "Source file does not exist at expected path: $relSource"
            exit 1
          }

          $sourceFile = (Resolve-Path $relSource).Path
          Write-Host "Resolved C# source path: $sourceFile"

          $pkgDir = (Resolve-Path "packages/agent-windows").Path
          $outDir = Join-Path $pkgDir "dist"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null

          $outputExe = Join-Path $outDir "SafeBrowseServiceHost.exe"
          Write-Host "Resolved output executable path: $outputExe"
          Write-Host "Compiling SafeBrowseServiceHost with $cscPath..."

          & $cscPath `
            /target:exe `
            /optimize+ `
            "/out:$outputExe" `
            /r:System.ServiceProcess.dll `
            "$sourceFile"

          $cscExitCode = $LASTEXITCODE
          if ($cscExitCode -ne 0) {
            Write-Error "csc.exe compilation failed with exit code $cscExitCode"
            exit $cscExitCode
          }

          if (-not (Test-Path $outputExe)) {
            Write-Error "Compiled executable not found at: $outputExe"
            exit 1
          }
          Write-Host "Compiled SafeBrowseServiceHost.exe successfully."

          # Compile SafeBrowseUserHelper.exe (Non-elevated user desktop helper)
          $userHelperRel = "packages/agent-windows/user-helper/SafeBrowseUserHelper.cs"
          if (Test-Path $userHelperRel) {
            $userHelperSource = (Resolve-Path $userHelperRel).Path
            $userHelperOutput = Join-Path $outDir "SafeBrowseUserHelper.exe"
            Write-Host "Compiling SafeBrowseUserHelper with $cscPath..."
            & $cscPath `
              /target:winexe `
              /optimize+ `
              "/out:$userHelperOutput" `
              "$userHelperSource"

            if ($LASTEXITCODE -ne 0) {
              Write-Error "csc.exe compilation of UserHelper failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
            }
            Write-Host "Compiled SafeBrowseUserHelper.exe successfully."
          }

          # Compile SafeBrowseGuiLauncher.exe (Windowless GUI launcher)
          $guiLauncherRel = "packages/agent-windows/gui-launcher/SafeBrowseGuiLauncher.cs"
          if (Test-Path $guiLauncherRel) {
            $guiLauncherSource = (Resolve-Path $guiLauncherRel).Path
            $guiLauncherOutput = Join-Path $outDir "SafeBrowseGuiLauncher.exe"
            Write-Host "Compiling SafeBrowseGuiLauncher with $cscPath..."
            & $cscPath `
              /target:winexe `
              /optimize+ `
              /r:System.Windows.Forms.dll `
              /r:System.Drawing.dll `
              /r:System.ServiceProcess.dll `
              "/out:$guiLauncherOutput" `
              "$guiLauncherSource"

            if ($LASTEXITCODE -ne 0) {
              Write-Error "csc.exe compilation of GuiLauncher failed with exit code $LASTEXITCODE"
              exit $LASTEXITCODE
            }
            Write-Host "Compiled SafeBrowseGuiLauncher.exe successfully."
          }

      - name: Build Single Executable Application (SafeBrowseChild-Pilot.exe)
        shell: pwsh
        run: |
          $releaseWinDir = "release/windows"
          if (-not (Test-Path $releaseWinDir)) { New-Item -ItemType Directory -Path $releaseWinDir -Force }

          $bundleJs = "$releaseWinDir/bundle.js"
          $seaConfig = "$releaseWinDir/sea-config.json"
          $seaBlob = "$releaseWinDir/sea-prep.blob"
          $targetExe = "$releaseWinDir/SafeBrowseChild-Pilot.exe"
          $entryTs = "packages/agent-windows/src/agent-cli.ts"

          # 0. Generate build-info with current HEAD
          node packages/agent-windows/scripts/generate-build-info.js

          # 1. Bundle TypeScript agent with esbuild
          Write-Host "Bundling agent-cli.ts with esbuild..."
          npx esbuild "$entryTs" --bundle --platform=node --target=node20 --outfile="$bundleJs"

          # 2. Generate SEA blob
          @{ main = $bundleJs; output = $seaBlob } | ConvertTo-Json | Set-Content -Path $seaConfig -Encoding UTF8
          Write-Host "Generating Node SEA blob..."
          node --experimental-sea-config "$seaConfig"

          # 3. Copy host node.exe
          $nodeExe = (Get-Command node).Source
          Write-Host "Copying host node binary ($nodeExe) to $targetExe..."
          Copy-Item -Path $nodeExe -Destination $targetExe -Force

          # 3b. Inject Win32 version metadata into host node binary where feasible
          try {
            Write-Host "Injecting Win32 version metadata into SafeBrowseChild-Pilot.exe..."
            node -e "
              const rcedit = require('rcedit');
              rcedit(process.argv[1], {
                'version-string': {
                  CompanyName: 'SafeBrowse',
                  FileDescription: 'SafeBrowse Child Pilot Core Engine',
                  ProductName: 'SafeBrowse Family Protection',
                  LegalCopyright: 'Copyright © 2026 SafeBrowse. All rights reserved.',
                  OriginalFilename: 'SafeBrowseChild-Pilot.exe'
                },
                'file-version': '1.0.4.14',
                'product-version': '1.0.4.14'
              }).then(() => console.log('[OK] Win32 metadata injected into SafeBrowseChild-Pilot.exe'))
                .catch(err => console.warn('[NOTE] rcedit metadata injection note:', err.message));
            " "$targetExe"
          } catch {
            Write-Host "rcedit note: $_"
          }

          # 4. Inject SEA blob into executable via postject
          Write-Host "Injecting SEA blob with postject..."
          npx --yes postject "$targetExe" NODE_SEA_BLOB "$seaBlob" --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2

          # Copy SafeBrowseServiceHost.exe, SafeBrowseUserHelper.exe, SafeBrowseGuiLauncher.exe, and helper scripts to release/windows
          Copy-Item "packages/agent-windows/dist/SafeBrowseServiceHost.exe" "$releaseWinDir/SafeBrowseServiceHost.exe" -Force
          if (Test-Path "packages/agent-windows/dist/SafeBrowseUserHelper.exe") {
            Copy-Item "packages/agent-windows/dist/SafeBrowseUserHelper.exe" "$releaseWinDir/SafeBrowseUserHelper.exe" -Force
          }
          if (Test-Path "packages/agent-windows/dist/SafeBrowseGuiLauncher.exe") {
            Copy-Item "packages/agent-windows/dist/SafeBrowseGuiLauncher.exe" "$releaseWinDir/SafeBrowseGuiLauncher.exe" -Force
          }
          Copy-Item "packages/agent-windows/wix/SafeBrowse-Pair.cmd" "$releaseWinDir/SafeBrowse-Pair.cmd" -Force
          Copy-Item "packages/agent-windows/wix/SafeBrowse-EmergencyRestore.cmd" "$releaseWinDir/SafeBrowse-EmergencyRestore.cmd" -Force

          $scriptsDest = "$releaseWinDir/scripts"
          if (-not (Test-Path $scriptsDest)) { New-Item -ItemType Directory -Path $scriptsDest -Force }
          Copy-Item "packages/agent-windows/scripts/configure-dns.ps1" "$scriptsDest/configure-dns.ps1" -Force
          Copy-Item "packages/agent-windows/scripts/restore-dns.ps1" "$scriptsDest/restore-dns.ps1" -Force
          Copy-Item "packages/agent-windows/scripts/verify-install-integrity.ps1" "$scriptsDest/verify-install-integrity.ps1" -Force
          Copy-Item "packages/agent-windows/scripts/verify-install-integrity.ps1" "$releaseWinDir/verify-install-integrity.ps1" -Force

          # Cleanup intermediate build files
          Remove-Item $bundleJs, $seaConfig, $seaBlob -ErrorAction SilentlyContinue

          if (-not (Test-Path $targetExe)) {
            Write-Error "Failed to generate SafeBrowseChild-Pilot.exe"
            exit 1
          }
          Write-Host "SafeBrowseChild-Pilot.exe generated successfully."

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 4.0.5
          wix extension add WixToolset.Util.wixext/4.0.5

      - name: Build SafeBrowseChild-Pilot.msi via WiX Toolset
        shell: pwsh
        run: |
          $wxsPath = (Resolve-Path "packages/agent-windows/wix/SafeBrowseChild-Pilot.wxs").Path
          $sourceDir = (Resolve-Path "release/windows").Path
          $msiOutput = Join-Path $sourceDir "SafeBrowseChild-Pilot.msi"

          Write-Host "Building MSI package with WiX Toolset v4..."
          Write-Host "WXS Path: $wxsPath"
          Write-Host "Source Directory: $sourceDir"
          Write-Host "MSI Output: $msiOutput"

          wix build -arch x64 "$wxsPath" -ext WixToolset.Util.wixext -d SourceDir="$sourceDir" -d ProductVersion="1.0.4.14" -o "$msiOutput"
          $wixExitCode = $LASTEXITCODE

          if ($wixExitCode -ne 0) {
            Write-Error "WiX build failed with exit code $wixExitCode"
            exit $wixExitCode
          }

          if (-not (Test-Path $msiOutput)) {
            Write-Error "Failed to generate SafeBrowseChild-Pilot.msi"
            exit 1
          }
          Write-Host "SafeBrowseChild-Pilot.msi built successfully."

      - name: Optional Authenticode Signing (Secure CI Stage)
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.SM_CODE_SIGNING_CERT || secrets.WINDOWS_SIGNING_CERT || '' }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SM_CODE_SIGNING_PASSWORD || secrets.WINDOWS_SIGNING_PASSWORD || '' }}
          TIMESTAMP_URL: "http://timestamp.digicert.com"
        run: |
          $releaseWinDir = "release/windows"
          $targets = @(
            "$releaseWinDir/SafeBrowseGuiLauncher.exe",
            "$releaseWinDir/SafeBrowseChild-Pilot.exe",
            "$releaseWinDir/SafeBrowseServiceHost.exe",
            "$releaseWinDir/SafeBrowseUserHelper.exe",
            "$releaseWinDir/SafeBrowseChild-Pilot.msi"
          )

          $certBase64 = $env:SIGNING_CERT_BASE64
          $certPassword = $env:SIGNING_CERT_PASSWORD

          if ([string]::IsNullOrEmpty($certBase64)) {
            Write-Host "========================================================"
            Write-Host "AUTHENTICODE SIGNING CREDENTIALS NOT CONFIGURED IN ENVIRONMENT."
            Write-Host "PRODUCING: UNSIGNED VALIDATION BUILD (Stage 11 Step 4)"
            Write-Host "========================================================"
            "SIGNING_STATUS=UNSIGNED (Local Pilot Physical Validation Build - Code-signing credentials not configured)" | Out-File -FilePath $env:GITHUB_ENV -Append
            exit 0
          }

          Write-Host "Authenticode signing credentials detected. Locating signtool.exe..."
          $signtoolPaths = @(
            "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe",
            "C:\Program Files\Windows Kits\10\bin\*\x64\signtool.exe"
          )
          $signtool = $null
          foreach ($pattern in $signtoolPaths) {
            $found = Get-Item -Path $pattern -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
            if ($found) { $signtool = $found.FullName; break }
          }

          if (-not $signtool) {
            Write-Error "signtool.exe not found on runner."
            exit 1
          }

          $tempCert = [System.IO.Path]::GetTempFileName() + ".pfx"
          try {
            [System.IO.File]::WriteAllBytes($tempCert, [System.Convert]::FromBase64String($certBase64))
            foreach ($file in $targets) {
              if (Test-Path $file) {
                Write-Host "Signing $file with SHA-256 and RFC-3161 timestamp..."
                $signArgs = @("sign", "/fd", "SHA256", "/f", $tempCert)
                if (-not [string]::IsNullOrEmpty($certPassword)) {
                  $signArgs += @("/p", $certPassword)
                }
                $signArgs += @("/tr", $env:TIMESTAMP_URL, "/td", "SHA256", $file)
                & $signtool $signArgs
                if ($LASTEXITCODE -ne 0) {
                  Write-Error "Failed to sign $file with exit code $LASTEXITCODE"
                  exit $LASTEXITCODE
                }
                Write-Host "[OK] Authenticode signature applied to $file"
              }
            }
            "SIGNING_STATUS=AUTHENTICODE SIGNED (Production / Staging Release)" | Out-File -FilePath $env:GITHUB_ENV -Append
          }
          finally {
            if (Test-Path $tempCert) { Remove-Item -Path $tempCert -Force }
          }

      - name: Verify PE Subsystems, Version Metadata, and Signature State (Post-Build Gate)
        shell: pwsh
        run: |
          $releaseWinDir = "release/windows"
          Write-Host "========================================================"
          Write-Host "POST-BUILD VERIFICATION: PE Subsystems, Metadata & State"
          Write-Host "========================================================"

          # 1. Verify File Existence
          $binaries = @(
            "SafeBrowseGuiLauncher.exe",
            "SafeBrowseServiceHost.exe",
            "SafeBrowseUserHelper.exe",
            "SafeBrowseChild-Pilot.exe",
            "SafeBrowseChild-Pilot.msi"
          )
          foreach ($bin in $binaries) {
            $p = Join-Path $releaseWinDir $bin
            if (-not (Test-Path $p)) {
              Write-Error "Missing build artifact: $bin"
              exit 1
            }
            Write-Host "  [OK] Found artifact: $bin"
          }

          # 2. Verify Version Metadata on C# executables
          $csharpBins = @("SafeBrowseGuiLauncher.exe", "SafeBrowseServiceHost.exe", "SafeBrowseUserHelper.exe")
          foreach ($bin in $csharpBins) {
            $p = Join-Path $releaseWinDir $bin
            $vi = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($p)
            Write-Host "Verifying metadata for $bin :"
            Write-Host "    CompanyName    : $($vi.CompanyName)"
            Write-Host "    ProductName    : $($vi.ProductName)"
            Write-Host "    FileDescription: $($vi.FileDescription)"
            Write-Host "    FileVersion    : $($vi.FileVersion)"
            Write-Host "    ProductVersion : $($vi.ProductVersion)"
            Write-Host "    LegalCopyright : $($vi.LegalCopyright)"

            if ($vi.CompanyName -ne "SafeBrowse") {
              Write-Error "Invalid CompanyName on ${bin}: $($vi.CompanyName)"
              exit 1
            }
            if (-not $vi.ProductName -or -not $vi.FileDescription) {
              Write-Error "Missing ProductName or FileDescription on ${bin}"
              exit 1
            }
            if ($vi.FileVersion -ne "1.0.4.14") {
              Write-Error "Invalid FileVersion on ${bin}: $($vi.FileVersion), expected 1.0.4.14"
              exit 1
            }
          }

          # 2b. Verify the Node SEA worker carries SafeBrowse metadata AFTER SEA injection.
          # This prevents Node's host FileVersion (for example 20.x) from leaking into MSI
          # file-version comparison and causing Windows Installer to retain a legacy worker.
          $workerPath = Join-Path $releaseWinDir "SafeBrowseChild-Pilot.exe"
          $workerVi = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($workerPath)
          Write-Host "SafeBrowseChild-Pilot.exe FileVersion: $($workerVi.FileVersion)"
          Write-Host "SafeBrowseChild-Pilot.exe ProductVersion: $($workerVi.ProductVersion)"
          if ($workerVi.FileVersion -ne "1.0.4.14") {
            Write-Error "Invalid SafeBrowseChild-Pilot.exe FileVersion: $($workerVi.FileVersion), expected 1.0.4.14"
            exit 1
          }

          # 3. Verify PE Subsystem on GUI Launcher (Must be GUI = 2, NOT CUI/Console = 3)
          $guiLauncherPath = Join-Path $releaseWinDir "SafeBrowseGuiLauncher.exe"
          $bytes = [System.IO.File]::ReadAllBytes($guiLauncherPath)
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3C)
          $magic = [System.BitConverter]::ToInt16($bytes, $peOffset + 24)
          $subsystemOffset = if ($magic -eq 0x20B) { $peOffset + 24 + 68 } else { $peOffset + 24 + 68 }
          $subsystem = [System.BitConverter]::ToInt16($bytes, $subsystemOffset)
          Write-Host "SafeBrowseGuiLauncher.exe PE Subsystem: $subsystem (2 = Windows GUI, 3 = Windows Console)"
          if ($subsystem -ne 2) {
            Write-Error "SafeBrowseGuiLauncher.exe must have subsystem 2 (IMAGE_SUBSYSTEM_WINDOWS_GUI), found: $subsystem"
            exit 1
          }

          # 4. Verify Authenticode Signature State
          foreach ($bin in $binaries) {
            $p = Join-Path $releaseWinDir $bin
            $sig = Get-AuthenticodeSignature -FilePath $p
            Write-Host "  $bin Signature Status: $($sig.Status)"
          }

          # 5. Verify MSI ProductVersion from database
          $msiPath = Join-Path $releaseWinDir "SafeBrowseChild-Pilot.msi"
          try {
            $com = New-Object -ComObject WindowsInstaller.Installer
            $db = $com.GetType().InvokeMember("OpenDatabase", "InvokeMethod", $null, $com, @($msiPath, 0))
            $view = $db.GetType().InvokeMember("OpenView", "InvokeMethod", $null, $db, @("SELECT Value FROM Property WHERE Property = 'ProductVersion'"))
            $view.GetType().InvokeMember("Execute", "InvokeMethod", $null, $view, $null)
            $record = $view.GetType().InvokeMember("Fetch", "InvokeMethod", $null, $view, $null)
            $msiVersion = $record.GetType().InvokeMember("StringData", "GetProperty", $null, $record, @(1))
            $view.GetType().InvokeMember("Close", "InvokeMethod", $null, $view, $null)
            [System.Runtime.InteropServices.Marshal]::ReleaseComObject($view) | Out-Null
            [System.Runtime.InteropServices.Marshal]::ReleaseComObject($db) | Out-Null
            [System.Runtime.InteropServices.Marshal]::ReleaseComObject($com) | Out-Null
            Write-Host "SafeBrowseChild-Pilot.msi ProductVersion: '$msiVersion'"
            if ($msiVersion -ne "1.0.4.14") {
              Write-Error "MSI ProductVersion mismatch! Expected '1.0.4.14' but found '$msiVersion'"
              exit 1
            }
          } catch {
            Write-Host "Notice: MSI database inspection note: $_"
          }

      - name: MSI-to-MSI Upgrade & Component KeyPath Regression Test (P0-7)
        timeout-minutes: 8
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Write-Host "========================================================"
          Write-Host "REAL MSI-TO-MSI UPGRADE REGRESSION TEST (P0-7)"
          Write-Host "========================================================"

          $installDir = "C:\Program Files\SafeBrowse"
          $prevDir = "previous-msi"
          New-Item -ItemType Directory -Path $prevDir -Force | Out-Null
          $prevMsi = Join-Path $prevDir "SafeBrowseChild-Pilot-Previous.msi"

          # 1. Acquire previous pilot MSI (from previous run 42800517782 [1.0.4.13], 42576191806, or fallback baseline)
          $downloadSuccess = $false
          try {
            Write-Host "Attempting download of previous pilot MSI from GitHub Actions run 42800517782 (1.0.4.13)..."
            gh run download 42800517782 -n SafeBrowseChild-Pilot-MSI -D $prevDir
            if (Test-Path "$prevDir/SafeBrowseChild-Pilot.msi") {
              Move-Item "$prevDir/SafeBrowseChild-Pilot.msi" $prevMsi -Force
              $downloadSuccess = $true
              Write-Host "[OK] Downloaded previous pilot MSI (1.0.4.13) from run 42800517782."
            }
          } catch {
            Write-Host "Notice: gh run download note: $_"
          }

          if (-not $downloadSuccess) {
            try {
              Write-Host "Attempting download of previous pilot MSI from GitHub Actions run 42576191806..."
              gh run download 42576191806 -n SafeBrowseChild-Pilot-MSI -D $prevDir
              if (Test-Path "$prevDir/SafeBrowseChild-Pilot.msi") {
                Move-Item "$prevDir/SafeBrowseChild-Pilot.msi" $prevMsi -Force
                $downloadSuccess = $true
                Write-Host "[OK] Downloaded previous pilot MSI from run 42576191806."
              }
            } catch {
              Write-Host "Notice: gh run download note: $_"
            }
          }

          if (-not $downloadSuccess) {
            try {
              Write-Host "Attempting download from release v1.0.3-pilot..."
              gh release download v1.0.3-pilot -p "SafeBrowseChild-Pilot.msi" -D $prevDir
              if (Test-Path "$prevDir/SafeBrowseChild-Pilot.msi") {
                Move-Item "$prevDir/SafeBrowseChild-Pilot.msi" $prevMsi -Force
                $downloadSuccess = $true
                Write-Host "[OK] Downloaded previous pilot MSI from release v1.0.3-pilot."
              }
            } catch {
              Write-Host "Notice: gh release download note: $_"
            }
          }

          if (-not $downloadSuccess) {
            Write-Host "Building baseline 1.0.4.13 MSI for upgrade test fallback..."
            $wxsPath = (Resolve-Path "packages/agent-windows/wix/SafeBrowseChild-Pilot.wxs").Path
            $sourceDir = (Resolve-Path "release/windows").Path
            wix build -arch x64 "$wxsPath" -ext WixToolset.Util.wixext -d SourceDir="$sourceDir" -d ProductVersion="1.0.4.13" -o $prevMsi
            if ($LASTEXITCODE -eq 0 -and (Test-Path $prevMsi)) {
              $downloadSuccess = $true
              Write-Host "[OK] Built baseline 1.0.4.13 fallback MSI."
            }
          }

          if (-not (Test-Path $prevMsi)) {
            Write-Error "FATAL: Could not obtain previous MSI for upgrade testing."
            exit 1
          }

          # Sub-step 1: Install previous pilot MSI
          Write-Host "`n[Step 1/12] Installing previous pilot MSI ($prevMsi)..."
          $prevInstallLog = Join-Path $PWD "install-previous.log"
          $proc = Start-Process msiexec.exe -ArgumentList "/i", "`"$prevMsi`"", "/qn", "/l*v", "`"$prevInstallLog`"" -Wait -PassThru
          Write-Host "Previous MSI installation exit code: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) {
            Write-Error "Failed to install previous MSI. Exit code: $($proc.ExitCode)"
            if (Test-Path $prevInstallLog) { Get-Content $prevInstallLog -Tail 100 }
            exit 1
          }

          # Sub-step 2: Verify previous files exist
          Write-Host "`n[Step 2/12] Verifying previous installation files exist..."
          if (-not (Test-Path "C:\Program Files\SafeBrowse\SafeBrowseServiceHost.exe")) {
            Write-Error "Previous install failed to produce C:\Program Files\SafeBrowse\SafeBrowseServiceHost.exe"
            exit 1
          }
          Write-Host "  [OK] Previous files exist."

          # Sub-step 3: Install new MSI (1.0.4.14) over it
          $newMsi = (Resolve-Path "release/windows/SafeBrowseChild-Pilot.msi").Path
          Write-Host "`n[Step 3/12] Upgrading to new MSI ($newMsi)..."
          $upgradeLog = Join-Path $PWD "install-upgrade.log"
          $proc = Start-Process msiexec.exe -ArgumentList "/i", "`"$newMsi`"", "/qn", "/l*v", "`"$upgradeLog`"" -Wait -PassThru

          # Sub-step 4: Verify upgrade succeeds
          Write-Host "`n[Step 4/12] Verifying upgrade installer exit code..."
          Write-Host "Upgrade MSI exit code: $($proc.ExitCode)"
          if ($proc.ExitCode -ne 0) {
            Write-Error "Upgrade MSI failed with exit code $($proc.ExitCode)"
            if (Test-Path $upgradeLog) { Get-Content $upgradeLog -Tail 150 }
            exit 1
          }
          Write-Host "  [OK] Upgrade MSI completed with status 0."

          # Sub-step 5: Verify all required installed files exist
          Write-Host "`n[Step 5/12] Verifying all required installed files exist..."
          $requiredBins = @(
            "SafeBrowseChild-Pilot.exe",
            "SafeBrowseServiceHost.exe",
            "SafeBrowseUserHelper.exe",
            "SafeBrowseGuiLauncher.exe"
          )
          foreach ($bin in $requiredBins) {
            $p = Join-Path $installDir $bin
            if (-not (Test-Path $p)) {
              Write-Error "CRITICAL DEFECT (P0-7): Required binary missing after upgrade: $bin"
              if (Test-Path $upgradeLog) {
                Write-Host "Relevant lines from upgrade log:"
                Select-String -Path $upgradeLog -Pattern "$bin|FileRemove|FileCopy" | Select-Object -Last 30 | ForEach-Object { $_.Line }
              }
              exit 1
            }
            Write-Host "  [OK] Found installed file after upgrade: $bin"
          }

          # Sub-steps 6 & 7: Calculate installed SHA-256 and compare to newly built artifacts
          Write-Host "`n[Steps 6 & 7/12] Comparing installed file SHA-256 values against newly built artifacts..."
          $sourceWinDir = (Resolve-Path "release/windows").Path
          foreach ($bin in $requiredBins) {
            $installedPath = Join-Path $installDir $bin
            $builtPath = Join-Path $sourceWinDir $bin
            $installedHash = (Get-FileHash -Path $installedPath -Algorithm SHA256).Hash.ToLower()
            $builtHash = (Get-FileHash -Path $builtPath -Algorithm SHA256).Hash.ToLower()
            Write-Host "  $bin :"
            Write-Host "    Installed: $installedHash"
            Write-Host "    Built    : $builtHash"
            if ($installedHash -ne $builtHash) {
              Write-Error "FATAL: Hash mismatch on $bin! Installed file does not match newly built artifact."
              exit 1
            }
            Write-Host "    [OK] Hash matches exactly."
          }

          # Sub-step 8: Verify service executable path
          Write-Host "`n[Step 8/12] Verifying SafeBrowseChildService executable path in SCM..."
          $service = Get-CimInstance win32_service -Filter "Name = 'SafeBrowseChildService'"
          if (-not $service) {
            Write-Error "SafeBrowseChildService is not registered in Windows SCM!"
            exit 1
          }
          Write-Host "  Service PathName: $($service.PathName)"
          if (-not $service.PathName.Contains("SafeBrowseServiceHost.exe")) {
            Write-Error "Service does not point to SafeBrowseServiceHost.exe: $($service.PathName)"
            exit 1
          }
          Write-Host "  [OK] Service executable path confirmed."

          # Sub-step 9: Start SafeBrowseChildService
          Write-Host "`n[Step 9/12] Starting SafeBrowseChildService..."
          try {
            Start-Service -Name "SafeBrowseChildService" -ErrorAction Stop
          } catch {
            Write-Host "Notice: Start-Service message: $_"
          }
          Start-Sleep -Seconds 3
          $svc = Get-Service -Name "SafeBrowseChildService"
          Write-Host "  Service Status: $($svc.Status)"

          # Sub-step 10: Verify SafeBrowseChild-Pilot.exe service worker starts
          Write-Host "`n[Step 10/12] Verifying SafeBrowseChild-Pilot service worker process..."
          $workerRunning = $false
          for ($i = 0; $i -lt 15; $i++) {
            $procs = Get-Process -Name "SafeBrowseChild-Pilot" -ErrorAction SilentlyContinue
            if ($procs) {
              $workerRunning = $true
              Write-Host "  [OK] SafeBrowseChild-Pilot running (PID: $($procs[0].Id))"
              break
            }
            Start-Sleep -Seconds 1
          }
          if (-not $workerRunning) {
            Write-Error "SafeBrowseChild-Pilot.exe service worker did not start within 15 seconds!"
            Get-EventLog -LogName Application -Source "SafeBrowseServiceHost" -Newest 10 -ErrorAction SilentlyContinue | Format-Table -AutoSize
            exit 1
          }

          # Sub-step 11: Verify localhost:8885 becomes responsive (/api/health and /api/status)
          Write-Host "`n[Step 11/12] Verifying localhost:8885 is responsive..."
          $guiResponsive = $false
          for ($i = 0; $i -lt 15; $i++) {
            try {
              Write-Host "Probing http://127.0.0.1:8885/api/health (attempt $($i + 1)/15)..."
              $healthRes = Invoke-WebRequest -Uri "http://127.0.0.1:8885/api/health" -UseBasicParsing -TimeoutSec 5
              if ($healthRes.StatusCode -eq 200) {
                Write-Host "  [OK] /api/health responded HTTP 200: $($healthRes.Content.Trim())"
              }
              Write-Host "Probing http://127.0.0.1:8885/api/status (attempt $($i + 1)/15)..."
              $res = Invoke-WebRequest -Uri "http://127.0.0.1:8885/api/status" -UseBasicParsing -TimeoutSec 15
              if ($res.StatusCode -eq 200) {
                $guiResponsive = $true
                Write-Host "  [OK] http://127.0.0.1:8885 responded with HTTP 200"
                $preview = if ($res.Content.Length -gt 120) { $res.Content.Substring(0, 120) + "..." } else { $res.Content }
                Write-Host "  Payload: $preview"
                break
              }
            } catch {
              Write-Host "  Probe note: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 2
          }
          if (-not $guiResponsive) {
            Write-Error "localhost:8885 failed to respond within timeout!"
            Get-Process -Name "SafeBrowse*" -ErrorAction SilentlyContinue | Format-Table -AutoSize
            netstat -ano | findstr 8885
            if (Test-Path "C:\ProgramData\SafeBrowse\logs\agent-service.log") {
              Write-Host "=== C:\ProgramData\SafeBrowse\logs\agent-service.log ==="
              Get-Content "C:\ProgramData\SafeBrowse\logs\agent-service.log" -Tail 100
            }
            exit 1
          }

          # Sub-step 12: Fail CI if any component is registered but key-path file absent
          Write-Host "`n[Step 12/12] Verifying all component KeyPaths are present on disk..."
          $allComponents = @(
            "SafeBrowseChild-Pilot.exe",
            "SafeBrowseServiceHost.exe",
            "SafeBrowseUserHelper.exe",
            "SafeBrowseGuiLauncher.exe",
            "SafeBrowse-Pair.cmd",
            "SafeBrowse-EmergencyRestore.cmd",
            "scripts\configure-dns.ps1",
            "scripts\restore-dns.ps1",
            "scripts\verify-install-integrity.ps1"
          )
          foreach ($comp in $allComponents) {
            $cp = Join-Path $installDir $comp
            if (-not (Test-Path $cp)) {
              Write-Error "CRITICAL: Key-path file missing from disk: $cp"
              exit 1
            }
            Write-Host "  [OK] Confirmed component key path: $comp"
          }

          # Stop service to clean up runner
          Stop-Service -Name "SafeBrowseChildService" -Force -ErrorAction SilentlyContinue
          Write-Host "`n[OK] REAL MSI-TO-MSI UPGRADE TEST (P0-7) PASSED COMPLETELY."

      - name: Calculate SHA-256 Checksums and Manifest
        shell: pwsh
        run: |
          $releaseWinDir = "release/windows"
          $exePath = "$releaseWinDir/SafeBrowseChild-Pilot.exe"
          $serviceHostPath = "$releaseWinDir/SafeBrowseServiceHost.exe"
          $userHelperPath = "$releaseWinDir/SafeBrowseUserHelper.exe"
          $guiLauncherPath = "$releaseWinDir/SafeBrowseGuiLauncher.exe"
          $msiPath = "$releaseWinDir/SafeBrowseChild-Pilot.msi"

          $exeHash = (Get-FileHash -Path $exePath -Algorithm SHA256).Hash.ToLower()
          $hostHash = (Get-FileHash -Path $serviceHostPath -Algorithm SHA256).Hash.ToLower()
          $msiHash = (Get-FileHash -Path $msiPath -Algorithm SHA256).Hash.ToLower()
          $userHelperHash = ""
          if (Test-Path $userHelperPath) {
            $userHelperHash = (Get-FileHash -Path $userHelperPath -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path "$userHelperPath.sha256" -Value "$userHelperHash *SafeBrowseUserHelper.exe" -Encoding UTF8
          }
          $guiLauncherHash = ""
          if (Test-Path $guiLauncherPath) {
            $guiLauncherHash = (Get-FileHash -Path $guiLauncherPath -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path "$guiLauncherPath.sha256" -Value "$guiLauncherHash *SafeBrowseGuiLauncher.exe" -Encoding UTF8
          }

          $signingStatus = $env:SIGNING_STATUS
          if ([string]::IsNullOrEmpty($signingStatus)) {
            $signingStatus = "UNSIGNED (Local Pilot Physical Validation Build - Code-signing credentials not configured)"
          }

          $manifestBackend = "${{ inputs.pilotBackendUrl || github.event.inputs.pilotBackendUrl || 'https://safebrowse.porwal.online' }}"
          $manifestLines = @(
            "# SafeBrowse Windows Pilot Build Checksum Manifest"
            "Timestamp: $((Get-Date).ToUniversalTime().ToString('o'))"
            "SigningStatus: $signingStatus"
            "TargetBackend: $manifestBackend"
            ""
            "$exeHash *SafeBrowseChild-Pilot.exe"
            "$hostHash *SafeBrowseServiceHost.exe"
          )
          if ($userHelperHash) {
            $manifestLines += "$userHelperHash *SafeBrowseUserHelper.exe"
          }
          if ($guiLauncherHash) {
            $manifestLines += "$guiLauncherHash *SafeBrowseGuiLauncher.exe"
          }
          $manifestLines += "$msiHash *SafeBrowseChild-Pilot.msi"

          $manifestFile = "$releaseWinDir/SHA256SUMS.txt"
          Set-Content -Path $manifestFile -Value ($manifestLines -join "`n") -Encoding UTF8

          Set-Content -Path "$exePath.sha256" -Value "$exeHash *SafeBrowseChild-Pilot.exe" -Encoding UTF8
          Set-Content -Path "$msiPath.sha256" -Value "$msiHash *SafeBrowseChild-Pilot.msi" -Encoding UTF8

          Write-Host "=== Checksum Summary ==="
          Write-Host "SafeBrowseChild-Pilot.exe: $exeHash"
          Write-Host "SafeBrowseServiceHost.exe: $hostHash"
          if ($userHelperHash) {
            Write-Host "SafeBrowseUserHelper.exe: $userHelperHash"
          }
          if ($guiLauncherHash) {
            Write-Host "SafeBrowseGuiLauncher.exe: $guiLauncherHash"
          }
          Write-Host "SafeBrowseChild-Pilot.msi: $msiHash"
          Write-Host "Signing Status: $signingStatus"

      - name: Upload SafeBrowse Windows Pilot MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeBrowseChild-Pilot-MSI
          path: |
            release/windows/SafeBrowseChild-Pilot.msi
            release/windows/SafeBrowseChild-Pilot.msi.sha256
            release/windows/SafeBrowseChild-Pilot.exe
            release/windows/SafeBrowseChild-Pilot.exe.sha256
            release/windows/SafeBrowseServiceHost.exe
            release/windows/SafeBrowseUserHelper.exe
            release/windows/SafeBrowseGuiLauncher.exe
            release/windows/SafeBrowseGuiLauncher.exe.sha256
            release/windows/verify-install-integrity.ps1
            release/windows/SHA256SUMS.txt
          if-no-files-found: error

      - name: Update GitHub Release Assets (v1.0.3-pilot)
        if: false # Disabled during validation candidate builds to strictly protect published releases
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $files = @(
            "release/windows/SafeBrowseChild-Pilot.msi",
            "release/windows/SafeBrowseChild-Pilot.msi.sha256",
            "release/windows/SafeBrowseChild-Pilot.exe",
            "release/windows/SafeBrowseChild-Pilot.exe.sha256",
            "release/windows/SafeBrowseServiceHost.exe",
            "release/windows/SHA256SUMS.txt"
          )
          Write-Host "Checking if release v1.0.3-pilot exists..."
          gh release view v1.0.3-pilot 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Creating release v1.0.3-pilot..."
            gh release create v1.0.3-pilot --title "SafeBrowse Windows Pilot Release v1.0.3 (P0 Hotfix)" --notes "SafeBrowse Windows Pilot v1.0.3 P0 Hotfix: Eliminates process termination on Dinner Time and Bedtime, ensures network-only loopback DNS enforcement, restricts process limiter strictly to explicit APP budgets, enforces immutable system process protection whitelist, eliminates image-wide taskkill in favor of child PID targeting, restores service to Automatic on upgrade, and provides user-friendly block page messaging without browser disruption."
          }
          Write-Host "Updating release v1.0.3-pilot assets via gh CLI..."
          gh release upload v1.0.3-pilot $files --clobber
